[package]
name = "sherbydrum"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A desktop drum partner for guitar practice"
license = "MIT"

[dependencies]
cpal = "0.15.3"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hound = "3.5.1"
midir = "0.11.0"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }

